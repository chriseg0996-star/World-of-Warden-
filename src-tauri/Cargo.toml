[package]
name = "wardenfall-desktop"
version = "0.7.0"
description = "Wardenfall desktop launcher"
authors = ["Wardenfall"]
edition = "2021"

[lib]
name = "wardenfall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
